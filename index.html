<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Conversation Intelligence Platform · Claude Desktop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FAFAF8;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #2E2E2C;
    }

    .app { display: flex; flex-direction: column; height: 100vh; background: #FAFAF8; position: relative; }

    /* Top bar */
    .claude-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2rem;
      background: rgba(250,250,248,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      flex-shrink: 0;
      z-index: 10;
    }
    .logo-cluster { display: flex; align-items: center; gap: 12px; }
    .icon-symbol {
      background: #DA7756;
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(218,119,86,0.25);
    }
    .icon-symbol i { font-size: 1.2rem; color: white; }
    .project-title { font-weight: 600; font-size: 1.2rem; letter-spacing: -0.2px; color: #2E2E2C; }
    .project-badge {
      font-size: 0.7rem;
      background: rgba(218,119,86,0.08);
      padding: 2px 10px; border-radius: 100px;
      margin-left: 10px; font-weight: 500; color: #BD5B3A;
    }

    /* Status pill */
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: #8C8C88;
      background: #F5F4F0;
      border-radius: 100px;
      padding: 4px 12px;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ccc;
      transition: background 0.3s;
    }
    .status-dot.online { background: #4CAF50; }
    .status-dot.error  { background: #E57373; }

    /* Chat canvas */
    .chat-canvas {
      flex: 1; overflow-y: auto;
      padding: 2rem 2rem 1.5rem 2rem;
      scroll-behavior: smooth;
      position: relative;
    }
    .bg-logo-emblem {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 280px; height: 280px;
      opacity: 0.04; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, rgba(218,119,86,0.25) 0%, rgba(218,119,86,0) 70%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .bg-logo-emblem i { font-size: 9rem; color: #DA7756; filter: blur(2px); }

    .message, .welcome-message { position: relative; z-index: 2; }

    .welcome-message {
      max-width: 700px; margin: 3rem auto 2rem auto;
      text-align: center; animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .welcome-message h1 { font-weight: 500; font-size: 1.9rem; letter-spacing: -0.3px; color: #2E2E2C; margin-bottom: 0.75rem; }
    .welcome-message p  { color: #8C8C88; font-size: 0.9rem; max-width: 480px; margin: 0 auto; }

    /* Messages */
    .message { display: flex; gap: 14px; max-width: 860px; margin: 0 auto 1.8rem auto; animation: slideMessage 0.2s ease-out; }
    @keyframes slideMessage {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message-avatar {
      width: 34px; height: 34px; border-radius: 10px;
      background: #F0EFEA; display: flex; align-items: center;
      justify-content: center; font-size: 0.95rem; flex-shrink: 0;
    }
    .message.user .message-avatar  { background: #ECE9E2; color: #6B6A65; }
    .message.ai   .message-avatar  { background: #FBEAE3; border: 1px solid rgba(218,119,86,0.18); color: #DA7756; }
    .message-content { flex: 1; line-height: 1.5; font-size: 0.95rem; padding-top: 4px; }
    .message.user .message-content { color: #2E2E2C; }
    .message.ai   .message-content { color: #3A3A37; }

    /* Audio badge */
    .audio-attachment-badge {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(218,119,86,0.08);
      border-radius: 48px; padding: 6px 16px 6px 12px;
      font-size: 0.75rem; margin-top: 12px;
      border: 1px solid rgba(218,119,86,0.2);
    }

    /* AI response card: wraps the answer in a bordered surface so each turn
       has a visible edge, with a footer row separating copy/meta from the
       answer text itself. */
    .ai-response-card {
      background: #FFFFFF;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 14px;
      padding: 1rem 1.1rem 0.7rem 1.1rem;
    }
    .ai-response-card .response-text { font-size: 0.95rem; line-height: 1.65; }
    .ai-response-card .response-text > *:first-child { margin-top: 0; }
    .ai-response-card .response-text > *:last-child  { margin-bottom: 0; }

    .response-footer {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid rgba(0,0,0,0.06);
      margin-top: 12px; padding-top: 8px;
    }

    /* Sources strip: collapsed summary line by default, expands to the
       detailed per-source list only when the user opens it. */
    .sources-strip {
      margin-top: 12px;
      background: #FAFAF8;
      border-radius: 10px;
      overflow: hidden;
    }
    .sources-summary {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; color: #6B6A65;
      padding: 8px 12px; cursor: pointer; user-select: none;
      background: none; border: none; width: 100%; text-align: left;
      font-family: inherit;
    }
    .sources-summary:hover { color: #BD5B3A; }
    .sources-summary i.fa-bookmark { color: #DA7756; font-size: 0.78rem; }
    .sources-summary .chevron { margin-left: auto; transition: transform 0.2s; font-size: 0.7rem; color: #B0AFA9; }
    .sources-strip.open .chevron { transform: rotate(180deg); }
    .source-name-pill {
      background: rgba(218,119,86,0.1); color: #BD5B3A;
      font-size: 0.68rem; font-weight: 500;
      padding: 2px 9px; border-radius: 100px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 160px;
    }
    .sources-detail {
      max-height: 0; overflow: hidden;
      transition: max-height 0.25s ease;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .sources-strip.open .sources-detail { max-height: 600px; }
    .source-item {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 0.75rem; color: #6B6A65;
      padding: 8px 12px; border-top: 1px solid rgba(0,0,0,0.04);
    }
    .source-item:first-of-type { border-top: none; }
    .source-ts { color: #DA7756; font-weight: 500; white-space: nowrap; }

    /* Claim evaluation cards: used when an AI response is structured
       evaluation JSON (factual-correctness checks) rather than plain text.
       One card per claim, with a colored badge for the classification. */
    .evaluation-block { display: flex; flex-direction: column; gap: 10px; }
    .evaluation-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px; font-size: 0.85rem; font-weight: 600; color: #2E2E2C;
    }
    .evaluation-header i { color: #DA7756; font-size: 1rem; }
    .evaluation-count { font-size: 0.72rem; color: #8C8C88; margin-left: auto; font-weight: 400; }

    .claim-card {
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 10px;
      padding: 12px 14px;
      background: #FAFAF8;
    }
    .claim-card-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 6px;
    }
    .claim-text { font-size: 0.88rem; color: #2E2E2C; font-weight: 500; margin: 0; line-height: 1.5; flex: 1; }
    .claim-reasoning { font-size: 0.8rem; color: #8C8C88; margin: 0; line-height: 1.55; }
    .claim-badge {
      font-size: 0.68rem; font-weight: 600;
      padding: 3px 10px; border-radius: 100px;
      white-space: nowrap; flex-shrink: 0;
    }
    /* Classification colors */
    .claim-card.status-verified    { background: rgba(76,175,80,0.04);  border-color: rgba(76,175,80,0.18); }
    .claim-badge.status-verified   { background: rgba(76,175,80,0.13);  color: #3E8E41; }
    .claim-card.status-contradicted  { background: rgba(212,70,60,0.04);  border-color: rgba(212,70,60,0.18); }
    .claim-badge.status-contradicted { background: rgba(212,70,60,0.13);  color: #C0392B; }
    .claim-card.status-insufficient  { background: #FAFAF8; }
    .claim-badge.status-insufficient { background: rgba(190,150,30,0.13); color: #9C7A1A; }
    .claim-card.status-unknown       { background: #FAFAF8; }
    .claim-badge.status-unknown      { background: rgba(140,140,136,0.13); color: #6B6A65; }

    /* Processing status */
    .processing-status {
      font-size: 0.78rem; color: #DA7756;
      display: flex; align-items: center; gap: 6px;
      margin-top: 8px;
    }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 5px; padding: 8px 0; }
    .typing-indicator span { width: 7px; height: 7px; background: #DCAA98; border-radius: 50%; animation: blink 1.3s infinite ease; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* Input dock */
    .input-dock {
      background: rgba(250,250,248,0.9);
      backdrop-filter: blur(24px);
      border-top: 1px solid rgba(0,0,0,0.04);
      padding: 1rem 2rem 1.8rem 2rem;
      flex-shrink: 0; position: relative; z-index: 10;
    }
    .input-wrapper { max-width: 860px; margin: 0 auto; position: relative; }
    .prompt-container {
      background: #FFFFFF; border-radius: 32px;
      border: 1px solid rgba(0,0,0,0.1);
      transition: all 0.2s;
      display: flex; align-items: flex-end; gap: 8px;
      padding: 0.55rem 1rem 0.55rem 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .prompt-container:focus-within { border-color: #DA7756; box-shadow: 0 0 0 3px rgba(218,119,86,0.12); }
    textarea {
      flex: 1; background: transparent; border: none;
      color: #2E2E2C; font-family: 'Inter', monospace;
      font-size: 0.95rem; padding: 12px 0;
      resize: none; outline: none; max-height: 130px; line-height: 1.45;
    }
    textarea::placeholder { color: #B0AFA9; font-weight: 400; }
    textarea:disabled { opacity: 0.5; cursor: not-allowed; }
    .audio-plus-btn {
      background: #F5F4F0; border: 1px solid rgba(0,0,0,0.08);
      width: 42px; height: 42px; border-radius: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; color: #8C8C88; font-size: 1.2rem;
    }
    .audio-plus-btn:hover { background: #DA7756; color: white; border-color: #DA7756; transform: scale(1.02); }
    .audio-plus-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .send-btn {
      background: #DA7756; border: none;
      width: 42px; height: 42px; border-radius: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; color: white;
    }
    .send-btn:hover   { background: #C9694C; transform: scale(1.02); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-footer { font-size: 0.7rem; text-align: center; margin-top: 12px; color: #B0AFA9; letter-spacing: 0.2px; }

    .chat-canvas::-webkit-scrollbar { width: 5px; }
    .chat-canvas::-webkit-scrollbar-track { background: transparent; }
    .chat-canvas::-webkit-scrollbar-thumb { background: #E5E3DD; border-radius: 10px; }

    .selected-files{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
  }

  .file-chip{
    display:flex;
    align-items:center;
    gap:8px;

    background:#F5F4F0;

    padding:8px 14px;

    border-radius:20px;

    border:1px solid #ddd;
  }

  .file-remove{
    cursor:pointer;
    color:red;
    font-weight:bold;
  }

  /* ── Contributors nav item ─────────────────────────────────────────────── */
  .contributors-nav {
    position: relative;
    display: flex;
    align-items: center;
  }

  .contributors-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 500;
    color: #8C8C88;
    background: #F5F4F0;
    border-radius: 100px;
    padding: 4px 12px;
    border: 1px solid rgba(0,0,0,0.06);
    cursor: default;
    user-select: none;
    transition: color 0.2s, background 0.2s, border-color 0.2s;
    letter-spacing: 0.1px;
  }

  .contributors-nav:hover .contributors-trigger,
  .contributors-nav:focus-within .contributors-trigger {
    color: #BD5B3A;
    background: rgba(218,119,86,0.08);
    border-color: rgba(218,119,86,0.22);
  }

  .contributors-trigger i {
    font-size: 0.7rem;
    transition: transform 0.35s cubic-bezier(.4,1.6,.6,1);
  }

  .contributors-nav:hover .contributors-trigger i,
  .contributors-nav:focus-within .contributors-trigger i {
    transform: rotate(180deg);
  }

  /* Dropdown panel */
  .contributors-dropdown {
    position: absolute;
    top: calc(100% + 10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    pointer-events: none;
    z-index: 999;
  }

  /* Each contributor card slides down from the trigger */
.contributor-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transform: translateY(-18px) scale(0.82);
  transition:
    opacity 0.32s cubic-bezier(.4,1.4,.6,1),
    transform 0.32s cubic-bezier(.4,1.4,.6,1);
  margin-bottom: 10px;
  pointer-events: none;
  width: 200px;
  justify-content: flex-end;
}

  /* Stagger delay per card (set via inline style) */
  .contributors-nav:hover .contributor-card,
  .contributors-nav:focus-within .contributor-card {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .contributor-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(218,119,86,0.35);
    box-shadow: 0 3px 10px rgba(218,119,86,0.18);
    background: #F5F4F0;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  }

  .contributor-card:hover .contributor-avatar {
    border-color: #DA7756;
    box-shadow: 0 5px 18px rgba(218,119,86,0.32);
    transform: scale(1.08);
  }

  .contributor-name {
    font-size: 0.62rem;
    font-weight: 500;
    color: #6B6A65;
    text-align: center;
    max-width: 64px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.3;
    background: rgba(250,250,248,0.92);
    border-radius: 20px;
    padding: 1px 7px;
    border: 1px solid rgba(0,0,0,0.06);
  }

  .contributor-card a {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  /* Loading / error state */
  .contributors-loading {
    font-size: 0.7rem;
    color: #B0AFA9;
    padding: 8px 12px;
    background: rgba(250,250,248,0.95);
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.06);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }

  .contributors-nav:hover .contributors-loading,
  .contributors-nav:focus-within .contributors-loading {
    opacity: 1;
    transform: translateY(0);
    pointer-events: none;
  }
  .message-actions{
    margin-top:10px;
  }

  .copy-btn{
    background:transparent;
    border:none;
    color:#999;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
  }

  .copy-btn:hover{
      color:white;
  }

  </style>
</head>

<div class="app">
  <div class="claude-topbar">
    <div class="logo-cluster">
      <div class="icon-symbol"><i class="fas fa-brain"></i></div>
      <div>
        <span class="project-title">Conversation Intelligence Platform</span>
        <span class="project-badge">Made By CPU interns</span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;">
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting…</span>
      </div>

      <!-- Contributors nav -->
      <div class="contributors-nav" id="contributorsNav" tabindex="0">
        <div class="contributors-trigger">
          <i class="fas fa-users"></i>
          Contributors
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="contributors-dropdown" id="contributorsDropdown">
          <div class="contributors-loading" id="contributorsLoading">
            <i class="fas fa-circle-notch fa-spin"></i> Loading…
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-canvas" id="chatMessages">
    <div class="bg-logo-emblem"><i class="fas fa-microphone-alt"></i></div>
    <div class="welcome-message" id="welcomeBlock">
      <h1>Conversation Intelligence</h1>
      <p>Upload audio, ask questions, and get intelligent RAG-powered insights from your recordings.</p>
    </div>
  </div>

  <div class="input-dock">
    <div class="input-wrapper">
  
      <!-- Selected audio will appear here -->
      <div id="selectedFiles" class="selected-files"></div>
  
      <div class="prompt-container">
        <textarea id="promptInput" rows="1" placeholder="Ask about your audio files or type a question…"></textarea>
  
        <button class="audio-plus-btn" id="audioPlusBtn" title="Upload audio file (MP3, WAV, M4A, OGG)">
          <i class="fas fa-plus"></i>
        </button>
  
        <button
    type="button"
    class="send-btn"
    id="sendBtn">
    <i class="fas fa-arrow-up"></i>
</button>
      </div>
  
      <div class="input-footer">
        <i class="fas fa-headphones"></i>
        + button supports audio only — MP3, WAV, M4A, OGG, FLAC
      </div>
    </div>
</div>



<input type="file" id="audioFileInput" accept="audio/mpeg,audio/wav,audio/mp3,audio/m4a,audio/ogg,audio/x-m4a,audio/flac,audio/webm" multiple style="display:none">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const API_BASE = 'http://127.0.0.1:5000/';

  // ── Elements ────────────────────────────────────────────────────────────────
  const chatContainer  = document.getElementById('chatMessages');
  const promptInput    = document.getElementById('promptInput');
  const sendBtn        = document.getElementById('sendBtn');
  const audioPlusBtn   = document.getElementById('audioPlusBtn');
  const audioFileInput = document.getElementById('audioFileInput');
  const welcomeBlock   = document.getElementById('welcomeBlock');
  const statusDot      = document.getElementById('statusDot');
  const statusText     = document.getElementById('statusText');

  const selectedFilesDiv = document.getElementById("selectedFiles");

  // ── State ───────────────────────────────────────────────────────────────────
  let messages = [];        // displayed chat messages
  let history  = [];        // [{role, content}] sent to backend
  let isBusy   = false;
  let pendingFiles = [];
  let stopStreaming = false;   // Stop flag for fake-stream animation
  let activeAbortController = null; // Lets "stop" actually cancel the in-flight fetch


  function showStopButton() {
    sendBtn.innerHTML = '<i class="fas fa-stop"></i>';
  }

  function showSendButton() {
    sendBtn.innerHTML = '<i class="fas fa-arrow-up"></i>';
  }

  // ── Health check ─────────────────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE}/transcribe/health`);
      const data = await res.json();
      if (data.status === 'ok') {
        statusDot.className = 'status-dot online';
        statusText.textContent = `Backend ready `;
      } else {
        setOffline();
      }
    } catch {
      setOffline();
    }
  }
  window.addEventListener("beforeunload", () => {
    console.log("PAGE IS RELOADING");
});
  function setOffline() {
    statusDot.className = 'status-dot error';
    statusText.textContent = 'Backend offline';
  }

  checkHealth();
  setInterval(checkHealth, 30000);

  // ── Helpers ──────────────────────────────────────────────────────────────────
  const scrollToBottom = () => {
    chatContainer.scrollTo({
        top: chatContainer.scrollHeight,
        behavior: "smooth"
    });
  };

  function formatSize(b) {
    if (b === null || b === undefined) return '';
    if (b === 0) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }

  // Maps a classification string from the backend to one of a fixed set of
  // CSS status classes used for claim-card coloring. Anything not in this
  // list (a new classification value the backend starts sending later)
  // falls through to "unknown" — a neutral gray card rather than breaking.
  function classificationToStatus(classification) {
    const c = (classification || '').toLowerCase();
    if (c.includes('verified') || c.includes('correct')) return 'verified';
    if (c.includes('contradict') || c.includes('incorrect')) return 'contradicted';
    if (c.includes('insufficient')) return 'insufficient';
    return 'unknown';
  }

  // Tries to parse a response as the backend's factual-correctness
  // evaluation JSON: an object whose keys look like "task_N_..." and whose
  // values are arrays of { claim, classification, reasoning }. The backend
  // sometimes returns this JSON directly and sometimes returns normal
  // markdown, so this MUST fail gracefully (return null) on anything that
  // isn't this exact shape — callers fall back to the normal markdown
  // render path when it does.
  function parseEvaluationResponse(rawText) {
    if (!rawText || typeof rawText !== 'string') return null;

    // Strip a wrapping ```json ... ``` fence if present — some responses
    // come back as markdown-fenced JSON rather than bare JSON.
    let candidate = rawText.trim();
    const fenceMatch = candidate.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
    if (fenceMatch) candidate = fenceMatch[1].trim();

    if (!candidate.startsWith('{')) return null;

    let parsed;
    try {
      parsed = JSON.parse(candidate);
    } catch {
      return null; // Not valid JSON — treat as plain markdown/text.
    }

    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return null;

    const taskKeys = Object.keys(parsed).filter(k => /^task_\d+_/.test(k));
    if (!taskKeys.length) return null; // Doesn't match the expected shape.

    const sections = [];
    for (const key of taskKeys) {
      const claims = parsed[key];
      if (!Array.isArray(claims)) continue;
      // Validate at least one entry actually looks like a claim object,
      // so we don't treat an unrelated task_N_* array as evaluation data.
      const validClaims = claims.filter(c => c && typeof c === 'object' && 'claim' in c && 'classification' in c);
      if (!validClaims.length) continue;

      const label = key
        .replace(/^task_\d+_/, '')
        .replace(/_/g, ' ')
        .replace(/\b\w/g, ch => ch.toUpperCase());

      sections.push({ key, label, claims: validClaims });
    }

    if (!sections.length) return null;
    return sections;
  }

  
  function setInputBusy(busy) {
    isBusy = busy;

    promptInput.disabled = busy;
    audioPlusBtn.disabled = busy;

    // sendBtn is intentionally left enabled even while busy: it doubles as
    // the "stop" button during streaming (see sendBtn click handler below),
    // so disabling it here would make it impossible to cancel a response.
    sendBtn.disabled = false;
  }

  // Builds the action row (currently just Copy) for an AI message.
  function buildMessageActions(getContent) {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.innerHTML = '<i class="fas fa-copy"></i> Copy';

    btn.onclick = async () => {
      await navigator.clipboard.writeText(getContent());
      btn.innerHTML = '<i class="fas fa-check"></i> Copied';
      setTimeout(() => {
        btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
      }, 1500);
    };

    actions.appendChild(btn);
    return actions;
  }

  // Builds the claim-card DOM for parsed evaluation sections (see
  // parseEvaluationResponse). One header + claim-card list per task_N_*
  // section, since a single response can contain more than one task array.
  function buildEvaluationDOM(sections) {
    const wrap = document.createElement('div');
    wrap.className = 'evaluation-block';

    sections.forEach(section => {
      const header = document.createElement('div');
      header.className = 'evaluation-header';
      header.innerHTML = `<i class="fas fa-clipboard-check"></i> <span>${section.label}</span>`;
      const count = document.createElement('span');
      count.className = 'evaluation-count';
      count.textContent = `${section.claims.length} claim${section.claims.length === 1 ? '' : 's'} checked`;
      header.appendChild(count);
      wrap.appendChild(header);

      section.claims.forEach(c => {
        const status = classificationToStatus(c.classification);

        const card = document.createElement('div');
        card.className = `claim-card status-${status}`;

        const top = document.createElement('div');
        top.className = 'claim-card-top';

        const claimText = document.createElement('p');
        claimText.className = 'claim-text';
        claimText.textContent = c.claim || '';
        top.appendChild(claimText);

        const badge = document.createElement('span');
        badge.className = `claim-badge status-${status}`;
        badge.textContent = c.classification || 'Unknown';
        top.appendChild(badge);

        card.appendChild(top);

        if (c.reasoning) {
          const reasoning = document.createElement('p');
          reasoning.className = 'claim-reasoning';
          reasoning.textContent = c.reasoning;
          card.appendChild(reasoning);
        }

        wrap.appendChild(card);
      });
    });

    return wrap;
  }

  // Builds a full message DOM node (avatar + content) for a given message
  // object. Used by both renderMessages() (full rerender) and appendMessage()
  // (single new message) so the two paths can't drift out of sync.
  function buildMessageNode(msg, index) {
    const wrap = document.createElement('div');
    wrap.className = `message ${msg.role}`;
    if (index !== undefined) wrap.dataset.index = index;

    const av = document.createElement('div');
    av.className = 'message-avatar';
    av.innerHTML = msg.role === 'user'
      ? '<i class="fas fa-user"></i>'
      : '<i class="fas fa-robot"></i>';

    const content = document.createElement('div');
    content.className = 'message-content';

    if (msg.role === 'ai') {
      // AI responses render inside a bordered card: answer text up top,
      // an optional collapsed sources strip, then a footer row with the
      // copy button and timestamp separated by a hairline.
      const card = document.createElement('div');
      card.className = 'ai-response-card';

      const text = document.createElement('div');
      text.className = 'response-text';

      // Try evaluation-JSON rendering first; fall back to normal markdown
      // for everything else (the backend sometimes returns one, sometimes
      // the other, for the same endpoint).
      const evalSections = parseEvaluationResponse(msg.content);
      if (evalSections) {
        text.appendChild(buildEvaluationDOM(evalSections));
      } else {
        text.innerHTML = marked.parse((msg.content || "").trim());
      }
      card.appendChild(text);

      if (msg.processing) {
        const ps = document.createElement('div');
        ps.className = 'processing-status';
        ps.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> ${msg.processing}`;
        card.appendChild(ps);
      }

      // Sources: collapsed by default. Clicking the summary row toggles
      // the detailed per-source list (timestamp, speaker, excerpt) open.
      if (msg.sources?.length) {
        const strip = document.createElement('div');
        strip.className = 'sources-strip';

        const summary = document.createElement('button');
        summary.type = 'button';
        summary.className = 'sources-summary';

        const uniqueNames = [...new Set(msg.sources.map(s => s.source_name))];
        const pillName = uniqueNames[0] || 'Source';
        const extra = uniqueNames.length > 1 ? ` +${uniqueNames.length - 1}` : '';

        summary.innerHTML = `
          <i class="fas fa-bookmark"></i>
          <span>${msg.sources.length} source${msg.sources.length === 1 ? '' : 's'}</span>
          <span class="source-name-pill" title="${uniqueNames.join(', ')}">${pillName}${extra}</span>
          <i class="fas fa-chevron-down chevron"></i>
        `;
        summary.addEventListener('click', () => strip.classList.toggle('open'));
        strip.appendChild(summary);

        const detail = document.createElement('div');
        detail.className = 'sources-detail';
        msg.sources.forEach(s => {
          const si = document.createElement('div');
          si.className = 'source-item';
          const spk = s.speaker ? ` · ${s.speaker}` : '';
          si.innerHTML = `<span class="source-ts">${s.start_fmt}–${s.end_fmt}</span>
            <span><strong>${s.source_name}</strong>${spk} — ${s.excerpt}</span>`;
          detail.appendChild(si);
        });
        strip.appendChild(detail);

        card.appendChild(strip);
      }

      // Footer: copy button (left) + timestamp/tokens (right), separated
      // from the answer body by a hairline divider.
      if (msg.content) {
        const footer = document.createElement('div');
        footer.className = 'response-footer';
        footer.appendChild(buildMessageActions(() => msg.content));

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        if (msg.tokens) meta.textContent += `  ·  ${msg.tokens} tokens`;
        footer.appendChild(meta);

        card.appendChild(footer);
      }

      content.appendChild(card);

    } else {
      // User messages keep the original plain layout — no card, just text,
      // attachments, and a timestamp underneath.
      const text = document.createElement('div');
      text.innerHTML = marked.parse((msg.content || "").trim());
      content.appendChild(text);

      if (msg.attachments?.length) {
        const aw = document.createElement('div');
        aw.style.marginTop = '12px';
        msg.attachments.forEach(att => {
          const badge = document.createElement('div');
          badge.className = 'audio-attachment-badge';
          badge.innerHTML = `<i class="fas fa-file-audio"></i> <span><strong>${att.name}</strong> (${formatSize(att.size)})</span>`;
          if (att.audioUrl) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.preload = 'metadata';
            audio.style.cssText = 'max-width:180px;height:32px;margin-left:12px;border-radius:40px;';
            audio.src = att.audioUrl;
            badge.appendChild(audio);
          }
          aw.appendChild(badge);
        });
        content.appendChild(aw);
      }

      const meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.style.marginTop = '8px';
      meta.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      content.appendChild(meta);
    }

    wrap.appendChild(av);
    wrap.appendChild(content);
    return wrap;
  }

  function appendMessage(msg) {
    const index = messages.length - 1;
    const wrap = buildMessageNode(msg, index);
    chatContainer.appendChild(wrap);
    scrollToBottom();
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  function renderMessages() {
    welcomeBlock.style.display = messages.length ? 'none' : 'block';

    Array.from(chatContainer.children).forEach(c => {
      if (c !== welcomeBlock && !c.classList.contains('bg-logo-emblem')) c.remove();
    });

    messages.forEach((msg, index) => {
      chatContainer.appendChild(buildMessageNode(msg, index));
    });

    scrollToBottom();
  }

  // ── Typing indicator ─────────────────────────────────────────────────────────
  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typingIndicator';
    div.innerHTML = `<div class="message-avatar"><i class="fas fa-robot"></i></div>
                     <div class="message-content">
                       <div class="typing-indicator"><span></span><span></span><span></span></div>
                     </div>`;
    chatContainer.appendChild(div);
    scrollToBottom();
  }
  function removeTypingIndicator() {
    document.getElementById('typingIndicator')?.remove();
  }

  // ── Upload audio → transcribe → index ────────────────────────────────────────
  async function uploadAudioFiles(files) {
    if (!files.length) return;
    setInputBusy(true);

    const attachments = files.map(f => ({
      name: f.name,
      size: f.size,
      audioUrl: URL.createObjectURL(f),
    }));

    const uploadMessage = `Uploading ${files.length} audio file(s): ${files.map(f => f.name).join(', ')}`;

    // Push user message immediately
    messages.push({
      role: 'user',
      content: uploadMessage,
      attachments,
      processing: 'Transcribing with WhisperX…',
    });
    // Keep history in sync with messages: every turn that's shown to the
    // user should also be represented in what's sent to the backend.
    history.push({ role: 'user', content: uploadMessage });

    renderMessages();
    addTypingIndicator();

    try {
      const fd = new FormData();
      files.forEach(f => fd.append('files', f));

      const res = await fetch(`${API_BASE}/upload`, { method: 'POST', body: fd });
      const data = await res.json();

      // Update user message: remove processing spinner
      messages[messages.length - 1].processing = null;

      if (!data.success) throw new Error(data.error || 'Upload failed');

      const ok = data.results.filter(r => r.success);
      const fail = data.results.filter(r => !r.success);

      let aiText = '';
      if (ok.length) {
        aiText += `✅ **Transcribed & indexed ${ok.length} file(s):**\n`;
        ok.forEach(r => {
          aiText += `\n🎙️ **${r.filename}**\n`;
          aiText += `   • Duration: ${r.duration_seconds ? Math.round(r.duration_seconds) + 's' : 'unknown'}\n`;
          aiText += `   • Language: ${r.language || 'auto'}\n`;
          aiText += `   • Segments: ${r.segment_count}\n`;
          aiText += `   • Transcription time: ${r.transcription_time_seconds}s\n`;
          aiText += `   • Preview: "${r.full_text_preview}"\n`;
        });
        aiText += `\nYou can now ask questions about the audio content!`;
      }
      if (fail.length) {
        aiText += `\n\n⚠️ ${fail.length} file(s) failed:\n`;
        fail.forEach(r => { aiText += `• ${r.filename}: ${r.error}\n`; });
      }

      removeTypingIndicator();
      messages.push({ role: 'ai', content: aiText, sources: [] });
      history.push({ role: 'assistant', content: aiText });

    } catch (err) {
      removeTypingIndicator();
      messages[messages.length - 1].processing = null;
      const errText = `❌ Upload error: ${err.message}`;
      messages.push({ role: 'ai', content: errText });
      history.push({ role: 'assistant', content: errText });
    }

    renderMessages();
    checkHealth();
    setInputBusy(false);
  }

  async function fakeStream(messageIndex, fullText) {

    const lastMessage = document.querySelector(".message.ai:last-child");
    const textDiv = lastMessage.querySelector(".response-text");

    // Evaluation JSON can't be meaningfully streamed character-by-character
    // — a half-typed "{ \"task_1_fact..." is just broken syntax, not a
    // readable partial answer the way streamed prose is. So if the FULL
    // response parses as evaluation JSON, skip the animation and render
    // the finished claim cards immediately.
    const evalSections = parseEvaluationResponse(fullText);
    if (evalSections) {
      textDiv.innerHTML = '';
      textDiv.appendChild(buildEvaluationDOM(evalSections));
      messages[messageIndex].content = fullText;
      addResponseFooter(messageIndex);
      return;
    }

    let current = "";
    let i = 0;

    while (i < fullText.length) {
      if (stopStreaming) {
        break;
      }

      // Random chunk size (2-5 characters)
      const chunkSize = Math.floor(Math.random() * 4) + 2;

      current += fullText.slice(i, i + chunkSize);

      textDiv.innerHTML = marked.parse(current);

      messages[messageIndex].content = current;

      i += chunkSize;

      // Random typing speed
      const delay = 10 + Math.random() * 30;

      await new Promise(resolve => setTimeout(resolve, delay));
    }
    messages[messageIndex].content = fullText;
    addResponseFooter(messageIndex);
  }

  // Builds the footer (copy button + timestamp) for an AI card once its
  // content is final. Called after streaming finishes, since the card is
  // created with empty content and so has no footer yet at that point.
  function addResponseFooter(messageIndex) {
    const wrap = document.querySelector(
        `.message[data-index="${messageIndex}"]`
    );

    if (!wrap) return;

    const card = wrap.querySelector(".ai-response-card");
    if (!card) return;

    if (card.querySelector(".response-footer")) return;

    const footer = document.createElement('div');
    footer.className = 'response-footer';
    footer.appendChild(buildMessageActions(() => messages[messageIndex].content));

    const meta = document.createElement('div');
    meta.className = 'message-meta';
    meta.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    if (messages[messageIndex].tokens) meta.textContent += `  ·  ${messages[messageIndex].tokens} tokens`;
    footer.appendChild(meta);

    card.appendChild(footer);
  }

  // ── Send text query → RAG ────────────────────────────────────────────────────
  async function sendMessage() {
    const question = promptInput.value.trim();

    if (!question || isBusy) {
      return;
    }

    const formData = new FormData();
    formData.append("question", question);

    if (pendingFiles.length > 0) {
      formData.append("audio", pendingFiles[0]);
    }

    setInputBusy(true);
    showStopButton();
    stopStreaming = false;
    promptInput.value = '';
    promptInput.style.height = 'auto';

    messages.push({
      role: 'user',
      content: question,
      attachments: pendingFiles.map(file => ({
        name: file.name
      }))
    });
    history.push({ role: 'user', content: question });
    appendMessage(messages[messages.length - 1]);
    addTypingIndicator();

    // Lets the stop button cancel the actual in-flight request, not just
    // the fake-stream animation that plays once the response arrives.
    activeAbortController = new AbortController();

    try {
      formData.append("history", JSON.stringify(history.slice(-10)));
      const res = await fetch(`${API_BASE}/transcribe/transcribe`, {
        method: "POST",
        body: formData,
        signal: activeAbortController.signal
      });
      const data = await res.json();

      removeTypingIndicator();

      if (!data.success) throw new Error(data.error || 'Query failed');
      const tokens = data.tokens_used?.total;

      messages.push({
        role: 'ai',
        content: "",
        sources: data.sources || [],
        tokens,
      });

      // Get the index of the newly added AI message
      const aiIndex = messages.length - 1;

      // Show the empty bubble
      appendMessage(messages[aiIndex]);

      // Stream the response into that bubble
      await fakeStream(aiIndex, data.answer);
      showSendButton();

      // Save the final response in history
      history.push({
        role: 'assistant',
        content: data.answer
      });

    } catch (err) {
      removeTypingIndicator();
      if (err.name === 'AbortError') {
        // Request was cancelled via the stop button — nothing further to do.
      } else {
        const errText = `❌ Error: ${err.message}`;
        messages.push({ role: 'ai', content: errText });
        history.push({ role: 'assistant', content: errText });
        appendMessage(messages[messages.length - 1]);
      }
      showSendButton();
    } finally {
      activeAbortController = null;
      pendingFiles = [];
      renderSelectedFiles();
      setInputBusy(false);
    }
  }

  function renderSelectedFiles() {
    
    selectedFilesDiv.innerHTML = "";
    pendingFiles.forEach((file, index) => {

      const chip = document.createElement("div");
      chip.className = "file-chip";
      chip.innerHTML = `
        <i class="fas fa-file-audio"></i>
        <div style="display:flex;flex-direction:column;">
          <strong>${file.name}</strong>
          <small>${formatSize(file.size)}</small>
        </div>
        <span class="file-remove">&times;</span>
      `;
      chip.querySelector(".file-remove").onclick = () => {
        pendingFiles.splice(index, 1);
        renderSelectedFiles();
      };
      selectedFilesDiv.appendChild(chip);
    });
  }

  // ──  listeners ──────────────────────────────────────────────────────────
  audioPlusBtn.addEventListener('click', e => {
    e.preventDefault();
    audioFileInput.value = '';
    audioFileInput.click();
  });

audioFileInput.addEventListener("change", (e) => {
    pendingFiles = Array.from(e.target.files);
    renderSelectedFiles();
    audioFileInput.value = "";
  });
  sendBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      if (isBusy) {
        // Stop button mode: halt the fake-stream animation AND abort the
        // underlying fetch so the backend request doesn't keep running
        // in the background after the user cancels.
        stopStreaming = true;
        if (activeAbortController) {
          activeAbortController.abort();
        }
        showSendButton();
        setInputBusy(false);
        return;
      }
      await sendMessage();
    }
  );

  promptInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  promptInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(120, this.scrollHeight) + 'px';
  });

  // Double-click title → reset
  document.querySelector('.project-title').addEventListener('dblclick', () => {
    messages.forEach(m => m.attachments?.forEach(a => { if (a.audioUrl) URL.revokeObjectURL(a.audioUrl); }));
    messages = [];
    history = [];
    renderMessages();
  });

  renderMessages();

  window.addEventListener('beforeunload', () => {
    messages.forEach(m => m.attachments?.forEach(a => { if (a.audioUrl) URL.revokeObjectURL(a.audioUrl); }));
  });

  // ── Contributors dropdown ────────────────────────────────────────────────────
  (function initContributors() {
    const nav      = document.getElementById('contributorsNav');
    const dropdown = document.getElementById('contributorsDropdown');
    const loading  = document.getElementById('contributorsLoading');
    let   loaded   = false;

    async function fetchContributors() {
      if (loaded) return;
      loaded = true;
      try {
        const res  = await fetch(API_BASE + '/contributors/avatar_sync', { method: 'GET'});
        const data = await res.json();

        loading.remove();

        const contributors = Array.isArray(data) ? data : (data.contributors || []);

        contributors.forEach((c, i) => {
          const card = document.createElement('div');
          card.className = 'contributor-card';
          // Stagger: each card appears 55 ms after the previous one
          card.style.transitionDelay = `${i * 55}ms`;

          card.innerHTML = `
            <a href="${c.html_url  || '#'}" target="_blank" rel="noopener noreferrer" title="${c.name || c.login}">
              <img class="contributor-avatar"
                   src="${c.avatar || c.avatar_url || ''}"
                   alt="${c.name || c.login}"
                   onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.name || c.login || '?')}&background=FBEAE3&color=DA7756&size=44'">
              <span class="contributor-name">${c.name || c.login}</span>
            </a>`;

          dropdown.appendChild(card);
        });

      } catch (err) {
        loading.innerHTML = `<i class="fas fa-exclamation-circle"></i> Failed to load`;
        console.warn('Contributors fetch error:', err);
      }
    }

    // Fetch on first hover
    nav.addEventListener('mouseenter', fetchContributors);
    nav.addEventListener('focusin',    fetchContributors);
  })();
</script>
</body>
</html>
